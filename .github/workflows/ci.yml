name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Start server
        run: |
          npm run build
          npx next start -p 3000 &
          sleep 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Phase 7 tests
        run: |
          echo "=== Phase 7 (Integrations) ==="
          curl -s http://localhost:3000/api/test/phase7 | python3 -m json.tool
          echo ""
          echo "=== Phase 7.3 (Collab) ==="
          curl -s http://localhost:3000/api/test/phase73 | python3 -m json.tool
          echo ""
          echo "=== Phase 7.5 (Billing) ==="
          curl -s http://localhost:3000/api/test/phase75 | python3 -m json.tool
          echo ""
          echo "=== Phase 7.6 (Admin) ==="
          curl -s http://localhost:3000/api/test/phase76 | python3 -m json.tool
          echo ""
          echo "=== Phase 7.7 (Collab Integration) ==="
          curl -s http://localhost:3000/api/test/phase77 | python3 -m json.tool
          echo ""
          echo "=== Phase 7.8 (Enterprise) ==="
          curl -s http://localhost:3000/api/test/phase78 | python3 -m json.tool
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
